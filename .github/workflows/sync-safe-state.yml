name: Sync Safe State

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/sync_safe_state.py
      - name: Commit if changed
        run: |
          git config user.name "ChanNest Safe State Bot"
          git config user.email "safe-state@channest.local"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi